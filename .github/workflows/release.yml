---
name: Release

"on":
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-version:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify tag and reviewed release notes
        id: release
        run: python scripts/release.py "$GITHUB_REF_NAME"
    outputs:
      prerelease: ${{ steps.release.outputs.prerelease }}
      version: ${{ steps.release.outputs.version }}

  validation:
    needs: verify-version
    uses: ./.github/workflows/validate.yml

  tests:
    needs: verify-version
    uses: ./.github/workflows/tests.yml

  build:
    needs: verify-version
    uses: ./.github/workflows/build.yml

  github-release:
    needs: [verify-version, validation, tests, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Prepare reviewed release notes
        run: >-
          python scripts/release.py "$GITHUB_REF_NAME" --notes release-notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: DTEK Telegram Bot ${{ needs.verify-version.outputs.version }}
          body_path: release-notes.md
          prerelease: ${{ needs.verify-version.outputs.prerelease == 'true' }}
          make_latest: >-
            ${{ needs.verify-version.outputs.prerelease == 'true'
                && 'false' || 'true' }}
