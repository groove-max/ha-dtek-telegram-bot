---
name: Release

"on":
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-version:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify tag matches add-on version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CONFIG_VERSION="$(
            grep '^version:' config.yaml \
              | sed -E 's/version:[[:space:]]*\"?([^"]+)\"?/\1/'
          )"

          if [[ -z "${CONFIG_VERSION}" ]]; then
            echo "Failed to read version from config.yaml"
            exit 1
          fi

          echo "Tag version:    ${TAG_VERSION}"
          echo "Config version: ${CONFIG_VERSION}"

          if [[ "${TAG_VERSION}" != "${CONFIG_VERSION}" ]]; then
            echo "Tag version does not match config.yaml version"
            exit 1
          fi

      - name: Verify changelog contains this version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          grep -F "## [${TAG_VERSION}]" CHANGELOG.md

  validation:
    needs: verify-version
    uses: ./.github/workflows/validate.yml

  tests:
    needs: verify-version
    uses: ./.github/workflows/tests.yml

  build:
    needs: verify-version
    uses: ./.github/workflows/build.yml

  github-release:
    needs: [verify-version, validation, tests, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
