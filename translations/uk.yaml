---
configuration:
  telegram_bot_token:
    name: Токен Telegram-бота
    description: >-
      Токен бота, отриманий у BotFather. Бажано використовувати окремий токен
      саме для цього add-on, особливо якщо в Home Assistant є інші Telegram
      інтеграції або автоматизації.
  telegram_chat_id:
    name: Telegram chat ID за замовчуванням
    description: >-
      ID особистого чату, групи або каналу. Для особистих повідомлень спочатку
      відкрийте бота й натисніть «Розпочати»; канал не потрібен. Вкажіть
      числовий ID, зберігши мінус для груп/каналів. Для окремих адрес
      призначення можна перевизначити у вебредакторі.
  test_chat_id:
    name: ID тестового чату
    description: >-
      Необов’язковий особистий чат, група або канал для ВСІХ повідомлень, поки
      заданий. Має пріоритет над основним чатом і чатами адрес. Перезапустіть
      для застосування.
  feedback_enabled:
    name: Збирати тестовий зворотний зв’язок
    description: >-
      Збирати нові доступні боту повідомлення тестового чату. Потрібні
      test_chat_id та один збирач оновлень на токен. Для надсилання сповіщень
      в особистий чат, групу або канал вмикати не потрібно.
