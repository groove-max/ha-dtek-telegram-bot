---
configuration:
  telegram_bot_token:
    name: Default Telegram bot token
    description: >-
      Token from BotFather for the default bot. Add other bots in the
      Telegram bots tab of the web editor and select them per address.
      Avoid sharing a token with other Telegram integrations.
  telegram_chat_id:
    name: Default Telegram chat ID
    description: >-
      Personal chat, group or channel ID. For personal messages, open your bot
      and press Start first; no channel is needed. Use the numeric chat ID,
      including the minus sign for groups/channels. Individual addresses can
      override this destination in the web editor.
  test_chat_id:
    name: Test destination chat ID
    description: >-
      Optional chat receiving all messages from the default bot while set.
      Overrides destinations of addresses using that bot. Other bot profiles
      have their own test settings in the web editor. Restart to apply.
  feedback_enabled:
    name: Collect test feedback
    description: >-
      Collect new messages visible to the bot in the test destination.
      Requires test_chat_id and one update collector per bot token. Not needed
      for sending notifications to a personal chat, group or channel.
